name: Rafraîchissement quotidien

on:
  schedule:
    - cron: "30 2 * * *" # tous les jours à ~4h30 heure de Paris, avant la session
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Régénérer calendrier et tableau de bord
        run: |
          python3 scripts/update_calendar.py
          python3 scripts/update_progress.py
      - name: Commit si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rafraîchissement quotidien calendrier + avancement"
          git push
